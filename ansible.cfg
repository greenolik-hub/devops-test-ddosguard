[defaults]
inventory = ./inventory/production/hosts.yml
roles_path = ./roles

host_key_checking = True
retry_files_enabled = False

interpreter_python = auto_silent

forks = 10
timeout = 30

# Файлы host_vars/*/vault.yml зашифрованы. Передайте пароль через
# --ask-vault-pass или раскомментируйте строку ниже и создайте файл
# (он уже в .gitignore).
# vault_password_file = ./.vault_pass

[privilege_escalation]
become = False
become_method = sudo
become_ask_pass = False
