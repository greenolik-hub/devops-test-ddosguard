---
# Параметры стенда, которые использует несколько ролей или play. Задаются
# в одном месте: роли и дашборд Grafana берут значения отсюда.

# Туннельный интерфейс: gre_tunnel создаёт его, traffic_control шейпит,
# дашборд Grafana рисует его график.
gre_interface: gre1

# Лимит туннеля в синтаксисе tc (только целые Мбит: <число>mbit).
# Из него же считается линия лимита на дашборде Grafana.
traffic_control_rate: 10mbit

# Порт node_exporter: firewall открывает его, Prometheus опрашивает.
node_exporter_port: 9100

# Порт iperf3: сервис слушает его, firewall открывает.
iperf3_port: 5201
