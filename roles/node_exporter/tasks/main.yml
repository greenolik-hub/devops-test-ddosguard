---
- name: Install node exporter
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    update_cache: true
    cache_valid_time: 3600

# Порт задаётся аргументом демона, поэтому смена node_exporter_port
# применяется на хосте, а не только в firewall и Prometheus.
- name: Configure node exporter listen address
  ansible.builtin.template:
    src: prometheus-node-exporter.default.j2
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: "0644"
  notify: Restart node exporter

- name: Enable node exporter
  ansible.builtin.systemd:
    name: prometheus-node-exporter
    enabled: true
    state: started
